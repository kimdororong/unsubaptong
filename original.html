<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운수밥통</title>
<!-- 사주 계산 라이브러리 (입춘·절기 기준 지원) -->
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<style>
  /* ── 디자인 값: 여기 숫자와 색만 바꾸면 화면 전체에 반영돼요 ── */
  :root {
    /* 색 */
    --bg: #fff;                  /* 배경 */
    --text: #111;                /* 기본 글자 */
    --text-sub: #666;            /* 작은 글자 */
    --main: #111;                /* 메인 버튼, 선택된 이름 칩, 테두리 */
    --on-main: #fff;             /* 메인 색 위에 올라가는 글자 */
    --disabled: #ccc;            /* 꺼진 버튼 */
    --track: #eee;               /* 막대그래프 바탕, 첫 화면 원 */
    --dim: rgba(0, 0, 0, 0.2);   /* 창이 뜰 때 뒤 배경 */

    /* 오행 포인트 색 — 결과 화면의 원에 쓰여요 */
    --wood: #ddd;    /* 목 */
    --fire: #ddd;    /* 화 */
    --earth: #ddd;   /* 토 */
    --metal: #ddd;   /* 금 */
    --water: #ddd;   /* 수 */

    /* 폰트 */
    --font: system-ui, sans-serif;   /* 기본 */
    --font-title: var(--font);       /* 로고, 날짜, 메뉴 이름 */

    /* 글자 크기 */
    --size-menu: 44px;    /* 메뉴 이름 — 화면에서 가장 크게 */
    --size-date: 32px;    /* 입력 화면 날짜 */
    --size-small: 14px;   /* 작은 글자 */

    /* 간격, 모서리 */
    --side: 16px;      /* 화면 좌우 여백 */
    --gap: 12px;       /* 결과 화면 요소 사이 */
    --radius: 8px;     /* 버튼, 창 모서리 */
    --circle: 144px;   /* 원 크기 — 아이콘(48px)이 선명하려면 48의 배수로 */
  }

  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { font-family: var(--font); color: var(--text); background: var(--bg); word-break: keep-all; } /* 한글을 단어 단위로 줄바꿈 */
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; font-size: 16px; } /* 16px보다 작으면 아이폰이 화면을 확대함 */

  .screen { max-width: 480px; min-height: 100dvh; margin: 0 auto; padding: 24px var(--side); }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); text-align: center; }
  .circle { width: var(--circle); height: var(--circle); border-radius: 50%; background: var(--point, var(--track)); display: grid; place-items: center; font-size: 40px; }
  .circle img { width: 100%; height: 100%; image-rendering: pixelated; } /* 픽셀 아이콘을 흐리지 않게 */
  .small { font-size: var(--size-small); color: var(--text-sub); }
  .primary { display: block; width: 100%; padding: 16px; border-radius: var(--radius); background: var(--main); color: var(--on-main); font-size: 18px; text-align: center; text-decoration: none; }
  .primary:disabled { background: var(--disabled); }

  /* 입력 화면 */
  #input { padding-bottom: 120px; text-align: center; } /* 하단 고정 버튼에 내용이 가리지 않게 */
  .top { position: relative; font-family: var(--font-title); }
  .help { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 1px solid var(--main); border-radius: 50%; }
  .today { font-family: var(--font-title); font-size: var(--size-date); font-weight: 700; margin: 16px 0 32px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
  .chip { display: inline-flex; align-items: center; min-height: 40px; border: 1px solid var(--main); border-radius: 999px; }
  .chip.on { background: var(--main); color: var(--on-main); }
  .chip .name { min-height: 40px; padding: 0 4px 0 14px; }
  .chip .del { min-height: 40px; padding: 0 12px 0 6px; font-size: 14px; }
  #plus { padding: 0 16px; }
  .add { display: grid; grid-template-columns: auto 1fr auto 1.2fr auto; gap: 6px; align-items: center; margin-bottom: 12px; font-size: var(--size-small); }
  .add input { width: 100%; min-width: 0; padding: 8px 6px; border: 1px solid var(--text-sub); border-radius: 6px; background: var(--bg); color: var(--text); }
  .add button { padding: 8px 12px; border-radius: 6px; background: var(--main); color: var(--on-main); }
  .add button:disabled { background: var(--disabled); }
  .add .err { grid-column: 1 / -1; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; padding: var(--side); background: var(--bg); }

  /* 결과 화면 */
  .line { line-height: 1.5; }
  .menu { font-family: var(--font-title); font-size: var(--size-menu); font-weight: 700; margin: 4px 0 8px; }
  .subs { display: flex; gap: 24px; }
  .subs button { padding: 8px; font-size: 15px; text-decoration: underline; }

  /* 자세히 보기 / 도움말 창 */
  dialog { margin: auto; width: min(340px, calc(100% - 32px)); padding: 24px; border: 1px solid var(--main); border-radius: calc(var(--radius) * 1.5); background: var(--bg); color: var(--text); }
  dialog::backdrop { background: var(--dim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  dialog h2 { font-family: var(--font-title); font-size: 18px; margin-bottom: 16px; }
  dialog p, dialog li { line-height: 1.6; }
  dialog ol { padding-left: 20px; }
  dialog form button { display: block; width: 100%; margin-top: 20px; padding: 12px; border: 1px solid var(--main); border-radius: var(--radius); }
  .bar { display: grid; grid-template-columns: 24px 1fr 24px; gap: 8px; align-items: center; margin: 6px 0; }
  .bar .track { height: 10px; background: var(--track); }
  .bar i { display: block; height: 100%; background: var(--main); }
  .bar.low { font-weight: 700; }
  #detailText { margin-top: 16px; }
  .debug { margin-top: 12px; white-space: pre-line; font-size: 12px; color: var(--text-sub); } /* 검증용 (검증 끝나면 삭제) */
</style>
</head>
<body>

<!-- 1. 첫 화면 -->
<section id="splash" class="screen center">
  <!-- 나중에 밥통 그림으로 교체 -->
  <div class="circle">밥통</div>
  <h1>운수밥통</h1>
  <p class="small">생년월일 넣으면 밥통이 점심 정해줌</p>
</section>

<!-- 2. 입력 화면 -->
<section id="input" class="screen" hidden>
  <header class="top">
    <strong>운수밥통</strong>
    <button id="helpBtn" class="help" aria-label="도움말">?</button>
  </header>
  <p id="today" class="today"></p>

  <h2 class="small">오늘 같이 먹는 사람</h2>
  <div id="chips" class="chips">
    <button id="plus" class="chip" aria-label="사람 추가">+</button>
  </div>

  <form id="addForm" class="add" hidden>
    <label for="nameIn">이름</label>
    <input id="nameIn" maxlength="6" autocomplete="off">
    <label for="birthIn">생년월일</label>
    <input id="birthIn" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" autocomplete="off">
    <button id="addBtn" disabled>추가</button>
    <p id="birthErr" class="err" hidden>날짜를 다시 확인해주세요</p>
  </form>

  <p id="count" class="small">0명 선택됨</p>

  <div class="bottom">
    <button id="cookBtn" class="primary" disabled>밥 짓기</button>
  </div>
</section>

<!-- 3. 로딩 -->
<section id="loading" class="screen center" hidden>
  <p>취사 중...</p>
</section>

<!-- 4. 결과 화면 -->
<section id="result" class="screen center" hidden>
  <p class="small">취사가 완료되었습니다</p>
  <p id="resDate" class="small"></p>
  <p class="small">오늘의 추천 메뉴는?</p>
  <p id="resLine" class="line"></p>
  <!-- 추천 메뉴의 픽셀 아이콘 (icons/ 폴더) -->
  <div id="resEl" class="circle"></div>
  <h1 id="resMenu" class="menu"></h1>
  <a id="mapBtn" class="primary" target="_blank" rel="noopener">지도에서 찾기</a>
  <div class="subs">
    <button id="detailBtn">자세히 보기</button>
    <button id="againBtn">다시 하기</button>
  </div>
</section>

<!-- 5. 자세히 보기 -->
<dialog id="detail">
  <h2>오늘의 오행 분포</h2>
  <div id="bars"></div>
  <p id="detailText"></p>
  <p id="debug" class="debug"></p> <!-- 검증용: 사주 글자 표시 (검증 끝나면 삭제) -->
  <form method="dialog"><button>닫기</button></form>
</dialog>

<!-- 6. 도움말 -->
<dialog id="help">
  <h2>추천 원리</h2>
  <ol>
    <li>같이 먹는 사람들의 생년월일로 사주를 뽑고, 오늘의 일진을 더해요.</li>
    <li>목·화·토·금·수 중 오늘 우리에게 부족한 기운을 찾아요.</li>
    <li>그 기운을 채우는 맛의 메뉴를 추천해요. 같은 멤버, 같은 날이면 결과는 바뀌지 않아요.</li>
  </ol>
  <form method="dialog"><button>닫기</button></form>
</dialog>

  // 오행이 고루 조화로운 날 (부족한 기운 없음 → 백반)
  const balanced = {
    line: "오행이 고루 조화로워요.\n골고루 차린 백반이 딱이에요.",
    desc: "다섯 기운이 고루 갖춰진 날이에요.\n어느 쪽도 모자라지 않아요.\n골고루 차린 한 상으로 균형 유지!",
  };
  // 자세히 보기: 부족한 오행 설명 (\n = 줄바꿈, 마침표마다)
  const descs = {
    목: "목은 나무의 기운, 새로 시작하는 힘이에요.\n오늘은 이게 모자라 시작이 굼떠요.\n새콤한 맛으로 깨워요.",
    화: "화는 불의 기운, 의욕과 열정 담당이에요.\n오늘은 불씨가 약해요.\n불맛으로 확 지펴요.",
    토: "토는 흙의 기운, 중심을 잡아주는 힘이에요.\n오늘은 마음이 붕 떠 있어요.\n든든한 곡물과 단맛으로 눌러줘요.",
    금: "금은 쇠의 기운, 딱 끊고 정리하는 힘이에요.\n오늘은 자꾸 흐지부지돼요.\n매운맛으로 정신 번쩍!",
    수: "수는 물의 기운, 차분히 쉬고 모으는 힘이에요.\n오늘은 바싹 말라 있어요.\n짭짤한 국물로 촉촉하게.",
  };

  const $ = (id) => document.getElementById(id);
  const chips = $("chips"), plus = $("plus"), addForm = $("addForm");
  const nameIn = $("nameIn"), birthIn = $("birthIn"), addBtn = $("addBtn"), birthErr = $("birthErr");

  // 명단 저장/읽기. 저장이 막힌 환경(사생활 보호 모드 등)이어도 앱은 그대로 동작
  const KEY = "unsubaptong.people";
  function loadPeople() {
    try {
      const list = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(list) ? list : [];
    } catch {
      return [];
    }
  }
  function savePeople() {
    try {
      localStorage.setItem(KEY, JSON.stringify(people));
    } catch {}
  }

  let people = loadPeople();  // 명단: { name, birth }
  const selected = new Set(); // 오늘 먹는 사람들

  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => (s.hidden = s.id !== id));
  }

  // 오늘 날짜
  function today() {
    // 검증용: 주소 끝에 ?date=2026-09-30 을 붙이면 그 날을 오늘로 계산 (검증 끝나면 아래 두 줄 삭제)
    const fake = new Date(`${new URLSearchParams(location.search).get("date")}T00:00`);
    if (!isNaN(fake)) return fake;
    return new Date();
  }

  function dateText(d) {
    return `${d.getMonth() + 1}.${d.getDate()}`;
  }

  // 8자리 + 실제로 있는 날짜(19950231 X) + 1900년 ~ 오늘
  function isValidBirth(s) {
    if (!/^\d{8}$/.test(s)) return false;
    const y = +s.slice(0, 4), m = +s.slice(4, 6), d = +s.slice(6, 8);
    const date = new Date(y, m - 1, d);
    return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d
      && y >= 1900 && date <= new Date();
  }

  // 글자 → 오행 (천간 10글자 + 지지 12글자)
  const OHENG = {
    甲: "목", 乙: "목", 丙: "화", 丁: "화", 戊: "토", 己: "토", 庚: "금", 辛: "금", 壬: "수", 癸: "수",
    寅: "목", 卯: "목", 巳: "화", 午: "화", 申: "금", 酉: "금", 亥: "수", 子: "수", 辰: "토", 戌: "토", 丑: "토", 未: "토",
  };

  // 생년월일 → [년주, 월주, 일주] (한자 2글자씩). 입춘·절기 경계는 라이브러리가 처리
  // ponytail: 태어난 시간을 모르니 낮 12시로 계산. 절기가 바뀌는 바로 그날 태어난 사람만 결과가 갈릴 수 있음
  function saju(birth) {
    const y = +birth.slice(0, 4), m = +birth.slice(4, 6), d = +birth.slice(6, 8);
    const e = Solar.fromYmdHms(y, m, d, 12, 0, 0).getLunar().getEightChar();
    return [e.getYear(), e.getMonth(), e.getDay()];
  }

  // 멤버 + 날짜 → 오행 개수, 부족한 오행, 메뉴. 랜덤 없음: 같은 멤버·같은 날이면 항상 같은 결과
  function recommend(members, date = new Date()) {
    const dayNum = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000; // 1970.1.1부터 며칠째
    const today = Solar.fromDate(date).getLunar().getDayInGanZhi(); // 오늘 일진 2글자

    // 1인당 사주 6글자 + 일진 2글자 = 8글자씩 세기
    const counts = { 목: 0, 화: 0, 토: 0, 금: 0, 수: 0 };
    for (const p of members) {
      for (const c of saju(p.birth).join("") + today) counts[OHENG[c]]++;
    }

    // 오행이 고루 조화로우면(가장 많은 것과 가장 적은 것의 차이가 1 이하) 부족한 기운 없이 백반
    const values = Object.values(counts);
    if (Math.max(...values) - Math.min(...values) <= 1) {
      return { counts, lack: null, menu: menus.토.find((m) => m.name === "백반") };
    }

    // 부족한 등수: 개수가 가장 적은 오행들 = 1등, 그다음으로 적은 오행들 = 2등
    const levels = [...new Set(Object.values(counts))].sort((a, b) => a - b);
    // 짝수 날은 1등, 홀수 날은 2등을 씀 (나오는 메뉴가 한두 오행에 몰리지 않게)
    const level = levels[Math.min(dayNum % 2, levels.length - 1)];
    // 같은 등수가 여럿이면 날짜로 돌려가며 하나 (랜덤 금지)
    const same = Object.keys(counts).filter((el) => counts[el] === level);
    const lack = same[dayNum % same.length];

    // 메뉴 순번 = (날짜 + 생년월일 숫자들의 합) ÷ 메뉴 개수의 나머지 → 다음 날엔 다음 메뉴
    const memberNum = members.reduce((sum, p) => sum + Number(p.birth), 0);
    const list = menus[lack];
    return { counts, lack, menu: list[(dayNum + memberNum) % list.length] };
  }

  // 이름 칩 하나: [이름 ×]
  function makeChip(p) {
    const chip = document.createElement("span");
    chip.className = selected.has(p) ? "chip on" : "chip";

    const name = document.createElement("button");
    name.className = "name";
    name.textContent = p.name;
    name.setAttribute("aria-pressed", selected.has(p));
    name.onclick = () => {
      if (selected.has(p)) selected.delete(p);
      else selected.add(p);
      renderRoster();
    };

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", `${p.name} 명단에서 삭제`);
    del.onclick = () => {
      people = people.filter((q) => q !== p);
      selected.delete(p);
      savePeople();
      renderRoster();
    };

    chip.append(name, del);
    return chip;
  }

  // 명단 다시 그리기 (추가/선택/삭제 할 때마다 호출)
  function renderRoster() {
    chips.replaceChildren(...people.map(makeChip), plus);
    if (people.length === 0) addForm.hidden = false; // 명단이 비어 있으면 추가 줄 펼치기
    plus.setAttribute("aria-expanded", !addForm.hidden);
    $("count").textContent = `${selected.size}명 선택됨`;
    $("cookBtn").disabled = selected.size === 0;
  }

  // 입력 검사: 이름 있음 + 생년월일 올바름 → 추가 버튼 켜기
  function checkForm() {
    birthIn.value = birthIn.value.replace(/\D/g, ""); // 숫자만 남기기
    const ok = isValidBirth(birthIn.value);
    // 아직 치는 중(8자리 전)이면 안내 문구는 참기
    const typing = birthIn.value.length < 8 && document.activeElement === birthIn;
    birthErr.hidden = ok || birthIn.value === "" || typing;
    addBtn.disabled = !ok || nameIn.value.trim() === "";
  }

  function showResult() {
    const members = people.filter((p) => selected.has(p)); // 명단 순서대로 (선택 순서 무관)
    const date = today();
    const { counts, lack, menu } = recommend(members, date);

    const who = members.length === 1 ? `${members[0].name}님은` : "우리는";
    $("resDate").textContent = `${dateText(date)} · ${members.map((p) => p.name).join(", ")}`;
    $("resLine").textContent = lack ? `오늘 ${who} ${lack} 기운이 부족해요. ${fills[lack]} 채워줘요.` : `오늘 ${who} ${balanced.line}`;
    $("resEl").innerHTML = `<img src="icons/메뉴/${menu.icon}" alt="">`; // 원 안에 메뉴 픽셀 아이콘
    document.body.style.setProperty("--point", lack ? `var(--${EN[lack]})` : "var(--earth)"); // 오늘 오행의 포인트 색 (조화로운 날은 백반이라 토)
    $("resMenu").textContent = menu.name;
    $("mapBtn").href = "https://map.naver.com/p/search/" + encodeURIComponent(menu.name);

    const max = Math.max(...Object.values(counts));
    $("bars").replaceChildren(...Object.entries(counts).map(([el, n]) => {
      const row = document.createElement("div");
      row.className = el === lack ? "bar low" : "bar";
      row.innerHTML = `<span>${el}</span><div class="track"><i style="width:${(n / max) * 100}%"></i></div><span>${n}</span>`;
      return row;
    }));
    $("detailText").textContent = lack ? descs[lack] : balanced.desc;

    // 검증용: 사람마다 사주 6글자 + 오늘 일진 2글자 (검증 끝나면 삭제)
    const dayPillar = Solar.fromDate(date).getLunar().getDayInGanZhi();
    $("debug").textContent = members.map((p) => `${p.name}  ${saju(p.birth).join(" ")} + ${dayPillar}`).join("\n");
  }

  // ── 버튼 연결 ──
  plus.onclick = () => {
    addForm.hidden = !addForm.hidden;
    renderRoster();
    if (!addForm.hidden) nameIn.focus();
  };
  nameIn.oninput = checkForm;
  birthIn.oninput = checkForm;
  birthIn.onblur = checkForm;
  addForm.onsubmit = (e) => {
    e.preventDefault();
    if (addBtn.disabled) return;
    const p = { name: nameIn.value.trim(), birth: birthIn.value };
    people.push(p);
    savePeople();
    selected.add(p); // 방금 추가한 사람은 바로 선택
    addForm.reset();
    checkForm();
    renderRoster();
    nameIn.focus();
  };
  $("cookBtn").onclick = () => {
    if (!window.Solar) {
      alert("사주 계산 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해주세요.");
      return;
    }
    show("loading");
    setTimeout(() => {
      showResult();
      show("result");
    }, 1500);
  };
  $("againBtn").onclick = () => show("input"); // 선택 상태는 그대로
  $("detailBtn").onclick = () => $("detail").showModal();
  $("helpBtn").onclick = () => $("help").showModal();

  // ── 시작 ──
  const now = today();
  $("today").textContent = `${dateText(now)} (${"일월화수목금토"[now.getDay()]})`;
  renderRoster();
  setTimeout(() => show("input"), 1500);
</script>
</body>
</html>
